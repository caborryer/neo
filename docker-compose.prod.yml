# Producción en un solo servidor. Uso:
#   cp deploy/env.production.example .env.production   # y completa los valores
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
# Guía completa: docs/DESPLIEGUE.md
name: neo

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: neo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}
      POSTGRES_DB: neo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neo -d neo"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sin "ports": la base solo es accesible desde la red interna de Docker.

  # Aplica las migraciones pendientes y termina. La API arranca solo después de que terminen bien.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: neo-api
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://neo:${POSTGRES_PASSWORD}@postgres:5432/neo?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: neo-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: "3000"
      WEB_ORIGIN: https://${SITE_ADDRESS:?define SITE_ADDRESS}
      DATABASE_URL: postgresql://neo:${POSTGRES_PASSWORD}@postgres:5432/neo?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?define JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?define JWT_REFRESH_SECRET}
      TRUST_PROXY: "1"
      STORAGE_DIR: /data/storage
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
      SMTP_HOST: ${SMTP_HOST:?define SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:?define MAIL_FROM}
    volumes:
      - storage:/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Sin "ports": solo Caddy llega a la API.

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?define SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
